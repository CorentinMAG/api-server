default_stages: [pre-commit]
minimum_pre_commit_version: "3.0.0"
default_language_version:
  python: python3.10
repos:
  - repo: local
    hooks:
      - id: setup-deps
        name: install-dependencies
        entry: python scripts/install_deps.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: formatter
        name: ruff-formatter
        entry: ruff format
        language: python
        types: [python]
        require_serial: true
      - id: linter
        name: ruff-linter
        entry: ruff check --fix
        language: python
        types: [python]
        require_serial: true
      - id: tests
        name: pytest-coverage
        entry: python scripts/run_tests_precommit.py
        language: python
        always_run: true
        require_serial: true
        pass_filenames: false