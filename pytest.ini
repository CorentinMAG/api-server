[pytest]
minversion = 7.0
testpaths = tests
addopts = -p no:warnings --strict-markers --strcit-config -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
xfail_strict = true
markers =
    unit: tests for a single unit of code
    integration: tests for integration between modules
    smoke: tests for basic functionality
    slow: slow running tests 