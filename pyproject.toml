[project]
name= = "api-server"
version = "2.4.1"
description = "A high-performance API server."
dependencies = [
    "flask==3.1.2",
    "pydantic==2.12.5",
    "sqlalchemy==2.0.45",
    "sqlalchemy-serializer==1.4.1"
]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.coverage.run]
branch = true
source = ["api"]